[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arvectum-dealforge"
version = "0.1.0"
description = "DealForge buyer-centric B2B deal acquisition and verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "arvectum-data @ git+https://github.com/arvectum2/data-platform.git@daa0719da31f989afcf49283ffa295cfb5f2ccac",
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.8,<1.0"]

[project.scripts]
dealforge = "dealforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dealforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
