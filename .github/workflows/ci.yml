name: DealForge CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install pinned dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Smoke
        run: dealforge health
