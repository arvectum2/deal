name: Mirror to GitVerse
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
concurrency:
  group: deal-gitverse-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate token
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          test -n "$GITVERSE_TOKEN" || { echo "::error::GITVERSE_TOKEN missing"; exit 1; }
      - name: Mirror branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repository.git
          cd repository.git
          git remote add gitverse "https://arvectum:${GITVERSE_TOKEN}@gitverse.ru/arvectum/deal.git"
          git push --force --prune gitverse 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
          gh_sha="$(git rev-parse refs/heads/main)"
          gv_sha="$(git ls-remote gitverse refs/heads/main | cut -f1)"
          test "$gh_sha" = "$gv_sha"
          echo "Mirror main: $gv_sha" >> "$GITHUB_STEP_SUMMARY"
